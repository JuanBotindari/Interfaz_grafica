name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ['main'] # ⚠️ cámbialo a 'master' si esa es tu rama principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      # 👇 PASO NUEVO: evita que Jekyll borre la carpeta _next
      - name: Ensure .nojekyll is present
        run: touch ./out/.nojekyll

      # 👇 PASO NUEVO (opcional pero muy útil para depurar)
      - name: List output contents
        run: |
          echo "=== Contenido de out/ ==="
          ls -la ./out
          echo "=== ¿Existe _next? ==="
          ls -la ./out/_next || echo "⚠️ _next NO existe"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
          include-hidden-files: true   # 👈 Clave para que .nojekyll se suba

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4